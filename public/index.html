<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNP &lt;&gt; AIRWALLEX</title>
    <script>
        // The session is in HttpOnly cookies, so ask the server rather than
        // looking in storage. A lapsed access cookie is renewed once.
        (async () => {
            const me = () => fetch('/api/auth/me', { credentials: 'same-origin' });
            let res = await me().catch(() => null);
            if (res && res.status === 401) {
                const renewed = await fetch('/api/auth/refresh', { method: 'POST', credentials: 'same-origin' })
                    .then((r) => r.ok)
                    .catch(() => false);
                if (renewed) res = await me().catch(() => null);
            }
            window.location.replace(res && res.ok ? '/dashboard' : '/login');
        })();
    </script>
</head>
<body></body>
</html>
